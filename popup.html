<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Term Library</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 380px;
      min-height: 320px;
      background: #0f0f1a;
      color: #e0e0ff;
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
    }

    header {
      padding: 20px 20px 14px;
      border-bottom: 1px solid #1e1e3a;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #7c6af7, #4ecdc4);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.3px;
      color: #fff;
    }

    #library-content { padding: 16px; }

    .term-count {
      font-size: 12px;
      color: #555;
      margin-bottom: 12px;
    }

    .term-list { display: flex; flex-direction: column; gap: 8px; max-height: 440px; overflow-y: auto; }

    .term-card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 12px 14px;
      position: relative;
    }

    .term-card:hover { border-color: #7c6af7; }

    .term-card p.text {
      font-size: 13px;
      color: #e0e0ff;
      line-height: 1.5;
      margin-bottom: 8px;
      padding-right: 18px;
    }

    .term-card a.source-link {
      font-size: 11px;
      color: #7c6af7;
      text-decoration: none;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .term-card a.source-link:hover { text-decoration: underline; }

    .term-date {
      font-size: 10px;
      color: #444;
      margin-top: 6px;
    }

    .delete-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      color: #444;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      padding: 2px;
    }

    .delete-btn:hover { color: #f77c6a; }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #444;
      font-size: 13px;
      line-height: 1.6;
    }

    .empty-state .icon { font-size: 32px; margin-bottom: 10px; }
  </style>
</head>
<body>

<header>
  <div class="logo">🔬</div>
  <h1>Term Library</h1>
</header>

<div id="library-content"></div>

<script src="popup.js"></script>
</body>
</html>
